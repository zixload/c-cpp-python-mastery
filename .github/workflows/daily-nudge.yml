name: Daily LeetCode nudge

on:
  schedule:
    # Every 3h from 7h to 22h Paris time (CEST = UTC+2): 5,8,11,14,17,20 UTC
    - cron: '0 5,8,11,14,17,20 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Send even if already committed today'
        type: boolean
        default: false

jobs:
  nudge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check if already committed today
        id: check
        run: |
          TODAY=$(date -u +%Y-%m-%dT00:00:00)
          COUNT=$(git log --since="$TODAY" --oneline | wc -l)
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"

      - name: Send Discord reminder
        if: steps.check.outputs.count == '0' || github.event.inputs.force == 'true'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          CHALLENGE=$(python3 scripts/pick_challenge.py)
          TITLE=$(printf '%s' "$CHALLENGE" | sed -n '1p')
          LINK=$(printf '%s' "$CHALLENGE" | sed -n '2p')

          if [ "${{ steps.check.outputs.count }}" = "0" ]; then
            PREFIX="Pas encore de commit aujourd'hui sur \`c-mastery\` 👀"
          else
            PREFIX="Defi bonus sur \`c-mastery\` (demande manuelle) :"
          fi
          MSG=$(printf "<@277728026790199296> %s\nDefi du jour : **%s**\n%s" "$PREFIX" "$TITLE" "$LINK")

          curl -s -H "Content-Type: application/json" \
            -d "$(jq -n --arg content "$MSG" '{content: $content}')" \
            "$DISCORD_WEBHOOK_URL"
